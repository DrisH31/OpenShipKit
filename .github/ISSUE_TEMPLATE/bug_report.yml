name: Bug report
description: Something in OpenShipKit doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [troubleshooting guide](https://github.com/DrisH31/openshipkit/blob/main/docs/troubleshooting.md) and existing issues first.
        **Security problems go to a private advisory, not here** (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Fresh clone, npm install, npm run dev
        2. Open /…
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it run
      options:
        - npm run dev (embedded Postgres)
        - npm run dev with DATABASE_URL
        - docker compose
        - Dokploy
        - Coolify
        - Plain Node (systemd)
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Set up by an AI agent?
      description: If an agent followed docs/ai-setup.md, say which step it was on.
      options:
        - "No"
        - Yes, with the prompts in docs/ai-setup.md
        - Yes, my own way
  - type: input
    id: version
    attributes:
      label: OpenShipKit version or commit
      placeholder: "1.0.0, or the output of git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "node -v → v24.x on Ubuntu 24.04"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log or browser console output. Remove secrets, emails and keys first.
      render: text
