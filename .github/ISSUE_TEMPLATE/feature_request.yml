name: Feature request
description: Suggest something OpenShipKit should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        OpenShipKit stays small, self-hosted and independent: no hosted auth, database or analytics services. Ideas that fit that are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Mention files or docs if you know where it belongs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this
