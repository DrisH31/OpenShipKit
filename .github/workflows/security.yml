# Security scanning for OpenShipKit (ROADMAP 1.1).
#
#   codeql        static analysis of the TypeScript (security-extended queries);
#                 findings land in the repository's Security tab.
#   audit         npm audit of the production dependencies: high or critical fails.
#                 Dev-only advisories don't ship in the image, so they don't block.
#   secrets       gitleaks over the full history: a committed key fails the run
#                 even after a later commit deletes it (it is still in git).
#   dependencies  on pull requests, refuses a new dependency with a known high
#                 advisory or a copyleft licence the MIT kit can't carry.
#
# Runs on every push and pull request, and weekly, so an advisory published
# against an unchanged lockfile still turns something red. No secrets needed:
# forks' pull requests run it too.

name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml uses [[allowlists]] (8.25+); the action's default version would ignore it.
          GITLEAKS_VERSION: "8.30.1"

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          comment-summary-in-pr: on-failure
