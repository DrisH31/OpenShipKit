# nginx in front of OpenShipKit on 127.0.0.1:3000.
#
#   sudo cp deploy/node/nginx.conf /etc/nginx/sites-available/openshipkit
#   (replace example.com) → enable → nginx -t → reload → certbot --nginx -d example.com
#
# certbot adds the `listen 443 ssl` lines and the certificate paths to this
# file and sets up renewal. Rules that matter:
#   - X-Forwarded-For is SET to the client address ($remote_addr), not
#     appended: the app's rate limits use its first entry, and appending would
#     let a client choose it.
#   - Proxy buffering stays at nginx's default (on) for every path, MCP
#     included: its replies are small JSON and nothing streams.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    client_max_body_size 2m;   # forms, webhooks (Polar's are well under 1 MB)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Media uploads (POST /api/admin/media): an image may be 5 MB plus the
    # multipart framing, so this one path gets more room than the 2m above.
    # The app enforces the real limit; this only has to let it through.
    location = /api/admin/media {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Hashed, immutable build assets: let nginx cache them hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Optional: www → apex. Add a DNS record for www and include it in certbot -d.
# server {
#     listen 80;
#     server_name www.example.com;
#     return 301 https://example.com$request_uri;
# }
